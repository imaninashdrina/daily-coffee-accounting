<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Coffee - Persediaan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body page-id="persediaan">
    <!-- Overlay Hitam Transparan untuk Layar HP saat Sidebar Buka -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <img src="logo.jpeg" alt="Logo Daily Coffee" class="logo">
                <div class="brand-text">
                    <h2>Daily Coffee</h2>
                    <span>Accounting System</span>
                </div>
            </div>

            <nav class="nav-menu">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="pembelian.html" class="nav-item"><i class="fa-solid fa-cart-flatbed"></i> Penerimaan Material</a>
                <a href="penjualan.html" class="nav-item"><i class="fa-solid fa-cash-register"></i> Transaksi Penjualan</a>
                <a href="persediaan.html" class="nav-item active"><i class="fa-solid fa-boxes-stacked"></i> Kartu Persediaan</a>
                <a href="jurnal.html" class="nav-item"><i class="fa-solid fa-book-journal-whills"></i> Jurnal Umum</a>
                <a href="laporan.html" class="nav-item"><i class="fa-solid fa-file-invoice-dollar"></i> Laporan Keuangan</a>
            </nav>

            <div class="sidebar-footer"><p>Daily Coffee Shop &copy; 2026</p></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <!-- Tombol Hamburger khusus Tampilan HP/Tablet -->
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <h1>Kartu Persediaan</h1>

                <div class="user-badge"><i class="fa-solid fa-circle-user"></i> <span>Kasir / Akuntan</span></div>
            </header>

            <div class="content-body">
                <div class="card">
                    <h2><i class="fa-solid fa-warehouse"></i> Kartu Stok & Nilai Persediaan Bahan Baku</h2>
                    <div class="table-responsive">
                        <table id="stock-table">
                            <thead>
                                <tr>
                                    <th>Kode</th>
                                    <th>Nama Bahan</th>
                                    <th>Stok Fisik</th>
                                    <th>Satuan</th>
                                    <th>Cost/Unit (Rp)</th>
                                    <th>Total Nilai (Rp)</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
