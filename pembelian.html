<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Coffee - Pembelian</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body page-id="pembelian">
    <!-- Overlay Hitam Transparan untuk Layar HP saat Sidebar Buka -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <img src="logo.jpeg" alt="Logo Daily Coffee" class="logo">
                <div class="brand-text">
                    <h2>Daily Coffee</h2>
                    <span>Accounting System</span>
                </div>
            </div>

            <nav class="nav-menu">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="pembelian.html" class="nav-item active"><i class="fa-solid fa-cart-flatbed"></i> Penerimaan Material</a>
                <a href="penjualan.html" class="nav-item"><i class="fa-solid fa-cash-register"></i> Transaksi Penjualan</a>
                <a href="persediaan.html" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i> Kartu Persediaan</a>
                <a href="jurnal.html" class="nav-item"><i class="fa-solid fa-book-journal-whills"></i> Jurnal Umum</a>
                <a href="laporan.html" class="nav-item"><i class="fa-solid fa-file-invoice-dollar"></i> Laporan Keuangan</a>
            </nav>

            <div class="sidebar-footer"><p>Daily Coffee Shop &copy; 2026</p></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <!-- Tombol Hamburger khusus Tampilan HP/Tablet -->
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <h1>Penerimaan Material</h1>

                <div class="user-badge">
                    <i class="fa-solid fa-circle-user"></i> <span>Kasir / Akuntan</span>
                </div>
            </header>

            <div class="content-body">
                <div class="card">
                    <h2><i class="fa-solid fa-truck-ramp-box"></i> Form Penerimaan Material (Pembelian Bahan Baku)</h2>
                    <form id="buy-material-form" class="form-grid">
                        <div class="form-group">
                            <label>Pilih Bahan Baku:</label>
                            <select id="buy-material-id" required></select>
                        </div>
                        <div class="form-group">
                            <label>Jumlah Diterima (Qty):</label>
                            <input type="number" id="buy-qty" step="0.01" required placeholder="Contoh: 1000">
                        </div>
                        <div class="form-group">
                            <label>Total Biaya Pembelian (Rp):</label>
                            <input type="number" id="buy-cost" required placeholder="Contoh: 150000">
                        </div>
                        <div class="form-group full-width">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i> Simpan & Update Jurnal Pembelian
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
